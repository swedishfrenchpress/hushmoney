<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG A: SHHHHHHH</title>
    <link rel="stylesheet" href="./og.css" />
    <style>
      #og {
        background: var(--ink);
        color: var(--green);
      }
      .checker {
        position: absolute;
        inset: 0 0 auto;
        height: 70px;
        background: repeating-conic-gradient(var(--green) 0 25%, var(--ink) 0 50%) 0 0 / 70px 70px;
      }
      .word {
        position: absolute;
        left: 46px;
        top: 226px;
        margin: 0;
        display: flex;
        align-items: baseline;
      }
      .word span {
        display: inline-block;
        transform-origin: 50% 100%;
      }
      .word .stop {
        position: relative;
        width: 0.27em;
        height: 0.27em;
        margin-left: 0.07em;
      }
      .foot {
        position: absolute;
        left: 48px;
        right: 48px;
        bottom: 44px;
        display: flex;
        justify-content: space-between;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <div id="og">
      <div class="checker"></div>
      <p class="word olline" aria-label="Shhhhhhh."></p>
      <div class="foot"><span>Hush Money</span><span>hushmoney.cash</span></div>
    </div>
    <script type="module">
      import { register, every, orb, fit, span, springy, easeOut, now } from './og.ts';

      const word = document.querySelector('.word');
      const letters = [...'SHHHHHHH'].map((c) => Object.assign(document.createElement('span'), { textContent: c }));
      const stop = Object.assign(document.createElement('span'), { className: 'stop orb-host' });
      word.append(...letters, stop);

      const ready = document.fonts.ready.then(async () => {
        fit(word, 1108);
        const o = await orb(stop, () => {
          const t = now();
          return { level: 0.42 * (0.55 + 0.45 * Math.sin(t * 1.3) + 0.25 * Math.sin(t * 3.7 + 1)), kick: 0.1 * Math.max(0, Math.sin(t * 2.3)) };
        }, { speed: 0.45, liquid: true });
        o.look('drift');
      });

      // The hush grows a letter at a time, the orb drops in as its full stop, holds, then
      // goes quiet from the end back to the S.
      const D = 6;
      every(D, (t) => {
        letters.forEach((el, i) => {
          const inn = springy(span(t, 0.15 + i * 0.11, 0.75 + i * 0.11));
          const out = easeOut(span(t, 4.7 + (7 - i) * 0.06, 5.15 + (7 - i) * 0.06));
          el.style.opacity = String(Math.min(1, inn * 1.4) * (1 - out));
          el.style.transform = `translateY(${(1 - inn) * 60 + out * 40}px) scaleY(${0.6 + 0.4 * inn})`;
        });
        const s = springy(span(t, 1.05, 1.75)) * (1 - easeOut(span(t, 4.55, 4.9)));
        stop.style.transform = `scale(${s})`;
      });

      register({ duration: D, hero: 3.4, ready });
    </script>
  </body>
</html>
