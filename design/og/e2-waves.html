<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG E2: The song as lights, as a soundwave</title>
    <link rel="stylesheet" href="./og.css" />
    <style>
      #og {
        background: var(--ink);
        color: var(--green);
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 1200px;
        height: 630px;
      }
      /* Just the title on a band of black, the soundwave rising out above it and below.
         Both are placed by the script, from the letters' own height. */
      .band {
        position: absolute;
        left: 0;
        right: 0;
        background: var(--ink);
      }
      .title {
        position: absolute;
        left: 46px;
        top: 0;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="og">
      <canvas width="1200" height="630"></canvas>
      <div class="band"></div>
      <p class="title olline">Hush Money</p>
    </div>
    <script type="module">
      import { register, kern, fit, now } from './og.ts';

      // A soundwave in lights, passing behind the title: every column of dots is one slice
      // of the sound, lit out from the middle as far as it is loud, so its peaks rise above
      // the band and fall below it. The loudness wanders like a voice, every column jitters
      // a little each frame, and stray dots spark and drop out, so it never reads as a grid.
      const PITCH = 14;
      const ROWS = Math.ceil(630 / PITCH);
      const MID = 315;
      const N = 150; // columns in one loop of the sound
      const SPEED = 25; // columns a second
      const D = N / SPEED; // 6 s
      const FLICKER = 12; // jitter steps a second
      const canvas = document.querySelector('canvas');
      const g = canvas.getContext('2d');

      // A repeatable random number for any whole numbers.
      const hash = (a, b = 0, c = 0) => {
        let h = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x632be5ab, 0xc2b2ae35) ^ Math.imul(c + 0x7f4a7c15, 0x27d4eb2f);
        h ^= h >>> 15;
        h = Math.imul(h, 0x2c1b3c6d);
        h ^= h >>> 12;
        return (h >>> 0) / 4294967296;
      };
      const wrap = (i) => ((i % N) + N) % N;

      // Loudness over the loop: phrases that swell and fade (sines that fit the loop exactly,
      // so it repeats without a seam), with each column's own random height on top, smoothed
      // a little with its neighbours, like the envelope of a recording.
      const raw = Array.from({ length: N }, (_, i) => {
        const x = (i / N) * Math.PI * 2;
        const phrase = Math.max(0, 0.55 + 0.45 * Math.sin(x * 3 + 0.6) + 0.25 * Math.sin(x * 7 + 2.1));
        const syllable = 0.55 + 0.45 * Math.abs(Math.sin(x * 11 + 0.3));
        return phrase * syllable * (0.2 + 0.8 * hash(i, 7));
      });
      const smooth = raw.map((_, i) => (raw[wrap(i - 1)] + 3 * raw[i] + raw[wrap(i + 1)]) / 5);
      const top = Math.max(...smooth);
      const loud = smooth.map((v) => v / top);
      const PAD = 30; // black above the capitals, and the same below them
      let BAND = 0; // half the band's height: a column has to reach past it to show

      // The band and the title share one centre line, the soundwave's. Olline's line box
      // holds more room under the baseline than over the capitals, so the letters are placed
      // by their ink: the capitals' height from the font, the baseline from the page.
      function centre(title) {
        const fs = parseFloat(title.style.fontSize);
        const probe = document.createElement('canvas').getContext('2d');
        probe.font = `700 ${fs}px Olline`;
        const ink = probe.measureText('HUSH MONEY');
        const marker = Object.assign(document.createElement('span'), { style: 'display:inline-block;width:0;height:0' });
        title.append(marker);
        const base = marker.getBoundingClientRect().top - document.querySelector('#og').getBoundingClientRect().top;
        marker.remove();
        const capTop = base - ink.actualBoundingBoxAscent;
        const capBottom = base + ink.actualBoundingBoxDescent;
        title.style.top = `${MID - (capTop + capBottom) / 2}px`;
        // Each edge of the band falls midway between two rows of lights, the same on both sides.
        const half = (capBottom - capTop) / 2 + PAD;
        BAND = Math.round((half - PITCH / 2) / PITCH) * PITCH + PITCH / 2;
        const band = document.querySelector('.band');
        band.style.top = `${MID - BAND}px`;
        band.style.height = `${BAND * 2}px`;
      }

      const ready = document.fonts.ready.then(() => {
        const title = document.querySelector('.title');
        kern(title);
        fit(title, 1108);
        centre(title);
        draw();
      });

      function draw() {
        const t = now() % D;
        const shift = t * SPEED;
        const first = Math.floor(shift);
        const frac = shift - first;
        const step = Math.floor(t * FLICKER) % Math.round(D * FLICKER);
        g.fillStyle = '#202020';
        g.fillRect(0, 0, 1200, 630);
        for (let c = 0; c < Math.ceil(1200 / PITCH) + 1; c++) {
          const col = wrap(first + c);
          const x = (c - frac) * PITCH + PITCH / 2;
          const jitter = 0.7 + 0.5 * hash(col, step, 1);
          const reach = BAND - 6 + loud[col] * jitter * 200; // px from the middle
          for (let r = 0; r < ROWS; r++) {
            const y = r * PITCH + PITCH / 2;
            const d = Math.abs(y - MID);
            const n = hash(col, r, step);
            let a = 0.08; // an unlit dot
            if (d < reach) {
              // Lit, brightest at the tip of the peak; now and then a dot drops out.
              const tip = 1 - (reach - d) / 70;
              a = n < 0.06 ? 0.16 : tip > 0 ? 1 : 0.55 + 0.45 * hash(col, r, 3);
            } else if (d < reach + PITCH * 1.5) {
              a = 0.32; // the glow just past the peak
            } else if (n > 0.993) {
              a = 0.85; // a stray spark
            }
            g.fillStyle = `rgb(123 251 112 / ${a})`;
            g.beginPath();
            g.arc(x, y, a > 0.5 ? 4.3 : 3.2, 0, Math.PI * 2);
            g.fill();
          }
        }
        requestAnimationFrame(draw);
      }

      register({ duration: D, hero: 2.4, ready });
    </script>
  </body>
</html>
